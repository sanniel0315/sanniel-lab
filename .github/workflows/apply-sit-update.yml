name: Apply Whale-700 SIT update

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: whale-700-sit-data
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[SIT-UPDATE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply authorized structured update
        id: update
        run: python apps/whale-700-sit/scripts/apply_issue_update.py

      - name: Commit data update
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          CHANGED_FILE: ${{ steps.update.outputs.changed_file }}
        run: |
          set -euo pipefail
          git config user.name "sanniel-lab-bot"
          git config user.email "51775347+sanniel0315@users.noreply.github.com"
          git add -- "$CHANGED_FILE" site/whale-700-sit/data-manifest.json
          if git diff --cached --quiet; then
            echo "No data change to commit."
          else
            git commit -m "data(sit): ${SUMMARY} (#${ISSUE_NUMBER})"
            git push origin HEAD:main
          fi

      - name: Record result and close update issue
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        with:
          script: |
            const body = [
              "✅ SANNIEL-LAB 已套用本次 SIT 更新。",
              "",
              `**${process.env.SUMMARY}**`,
              "",
              "資料已寫回 `main`；GitHub Pages 會由既有部署流程重新發布。",
              `稽核來源：#${context.issue.number} / ${context.actor}`
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "completed"
            });
